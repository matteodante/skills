name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ./scripts/validate-skills.sh
      - run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          bash -n scripts/validate-skills.sh
          sh -n skills/idea-to-ios-app/scripts/check-companion-skills.sh
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/validate-skills.sh skills/idea-to-ios-app/scripts/check-companion-skills.sh
